# nginx configuration for the CareerForge static SPA.
#
# Caching strategy:
#   - Hashed assets under /assets/ are immutably cached for one year.
#   - index.html, the service worker, and the manifest are served without caching so
#     new builds are picked up on the next request.
#   - Unmatched paths fall back to index.html for client-side routing.

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
